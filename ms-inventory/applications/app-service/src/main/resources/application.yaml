server:
  port: 8082
spring:
  application:
    name: "ms-inventory"
  devtools:
    add-properties: false
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/arka_inventory}
    username: ${DB_USER:arka}
    password: ${DB_PASSWORD:arka123}
    pool:
      initial-size: 5
      max-size: 10
      validation-query: "SELECT 1"
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ms-inventory
      auto-offset-reset: earliest
management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
arka:
  inventory:
    use-in-memory-repository: ${ARKA_INVENTORY_USE_IN_MEMORY_REPOSITORY:true}
    use-in-memory-broker: ${ARKA_INVENTORY_USE_IN_MEMORY_BROKER:true}

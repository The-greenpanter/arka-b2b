# Log4j2 configuration for ms-inventory

status = warn
name = ms-inventory

# Configure the RollingFile appender
appender.rolling.type = RollingFile
appender.rolling.name = RollingFile
appender.rolling.fileName = logs/ms-inventory.log
appender.rolling.filePattern = logs/ms-inventory-%d{yyyy-MM-dd}-%i.log
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = %d{ISO8601} [%t] %-5p %c{1.} - %m%n
appender.rolling.policies.type = Policies
appender.rolling.policies.time.type = TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval = 1
appender.rolling.policies.time.modulate = true
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 100MB

# Configure console appender
appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{ISO8601} [%t] %-5p %c{1.} - %m%n

# Root logger
rootLogger.level = info
rootLogger.appenderRef.stdout.ref = STDOUT
rootLogger.appenderRef.rolling.ref = RollingFile

# Spring Boot loggers
logger.spring.name = org.springframework
logger.spring.level = info

# R2DBC loggers (debug if needed)
logger.r2dbc.name = org.springframework.r2dbc
logger.r2dbc.level = info

# Domain loggers
logger.domain.name = co.com.bancolombia
logger.domain.level = debug

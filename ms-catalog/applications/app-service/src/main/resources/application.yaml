server:
  port: 8081
spring:
  application:
    name: "ms-catalog"
  devtools:
    add-properties: false
  data:
    mongodb:
      uri: mongodb://localhost:27017/arka_catalog
      auto-index-creation: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ms-catalog
      auto-offset-reset: earliest
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus,info"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080,http://localhost:8081"
arka:
  catalog:
    use-in-memory-repository: true
    use-in-memory-broker: true
---
spring:
  config:
    activate:
      on-profile: docker
  data:
    mongodb:
      uri: mongodb://arka:arka123@mongodb.arka.local:27017/arka_catalog
      auto-index-creation: false
  kafka:
    bootstrap-servers: kafka.arka.local:9092
arka:
  catalog:
    use-in-memory-repository: false
    use-in-memory-broker: false

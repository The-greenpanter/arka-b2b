server:
  port: 8084
spring:
  application:
    name: "ms-payment"
  devtools:
    add-properties: false
  r2dbc:
    url: ${R2DBC_URL:r2dbc:postgresql://localhost:5432/arka_payment}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    pool:
      initial-size: 10
      max-size: 20
      validation-query: "SELECT 1"
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ms-payment
      auto-offset-reset: earliest
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus,info"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080,http://localhost:8084"

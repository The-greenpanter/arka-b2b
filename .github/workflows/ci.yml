name: ARKA B2B CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-ms-catalog:
    name: Test ms-catalog
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ms-catalog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Test (exclude mongo-repository)
        run: ./gradlew :model:test :usecase:test :reactive-web:test --no-daemon

  test-ms-inventory:
    name: Test ms-inventory
    runs-on: ubuntu-latest
    defaults:

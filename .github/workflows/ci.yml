        run: ./gradlew :model:test :usecase:test --no-daemon

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-ms-catalog, test-ms-inventory, test-ms-provider, test-ms-cart, test-ms-order, test-ms-payment, test-ms-notifications, test-ms-reporter]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ms-catalog image
        run: docker build -t arka/ms-catalog:${{ github.sha }} ./ms-catalog
      - name: Build ms-inventory image
        run: docker build -t arka/ms-inventory:${{ github.sha }} ./ms-inventory
      - name: Build ms-provider image
        run: docker build -t arka/ms-provider:${{ github.sha }} ./ms-provider
      - name: Build ms-cart image
        run: docker build -t arka/ms-cart:${{ github.sha }} ./ms-cart
      - name: Build ms-order image
        run: docker build -t arka/ms-order:${{ github.sha }} ./ms-order
      - name: Build ms-payment image
        run: docker build -t arka/ms-payment:${{ github.sha }} ./ms-payment
      - name: Build ms-notifications image
        run: docker build -t arka/ms-notifications:${{ github.sha }} ./ms-notifications
      - name: Build ms-reporter image
        run: docker build -t arka/ms-reporter:${{ github.sha }} ./ms-reporter
      - name: Build api-gateway image
        run: docker build -t arka/api-gateway:${{ github.sha }} ./api-gateway

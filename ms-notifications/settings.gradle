pluginManagement { repositories { gradlePluginPortal() } }
buildCache { local { directory = new File(rootDir, 'build-cache') } }
rootProject.name = 'ms-notifications'
include ':app-service', ':model', ':usecase', ':reactive-web', ':kafka-consumer'
project(':app-service').projectDir  = file('./applications/app-service')
project(':model').projectDir        = file('./domain/model')
project(':usecase').projectDir      = file('./domain/usecase')
project(':reactive-web').projectDir = file('./infrastructure/entry-points/reactive-web')
project(':kafka-consumer').projectDir = file('./infrastructure/driven-adapters/kafka-consumer')

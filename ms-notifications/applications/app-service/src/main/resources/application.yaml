server:
  port: 8087
spring:
  application:
    name: "ms-notifications"
  devtools:
    add-properties: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ms-notifications
      auto-offset-reset: earliest
management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

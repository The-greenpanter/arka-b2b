server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls → api-gateway (sin exponer IP del gateway al browser)
    location /api/ {
        proxy_pass http://api-gateway.arka.local:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # SPA fallback — todas las rutas van a index.html (Vue Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
